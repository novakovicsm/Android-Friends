plugins {
    id 'com.android.application'
}

import org.gradle.api.DefaultTask
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

import java.util.zip.ZipFile

configurations {
    natives
}

abstract class CopyAndroidNativesTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getNatives()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyNatives() {
        File rootDir = outputDir.get().asFile
        rootDir.mkdirs()
        natives.files.each { File jarFile ->
            def matcher = jarFile.name =~ /-natives-(.+)\.jar$/
            if (!matcher.find()) {
                return
            }
            File abiDir = new File(rootDir, matcher.group(1))
            abiDir.mkdirs()
            new ZipFile(jarFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.name.endsWith('.so')) {
                        return
                    }
                    File target = new File(abiDir, new File(entry.name).name)
                    target.bytes = zip.getInputStream(entry).bytes
                }
            }
        }
    }
}

android {
    namespace 'com.yourstudio.horse'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.yourstudio.horse'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['../assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

def nativesConfiguration = configurations.named('natives')
def jniLibsDir = layout.projectDirectory.dir('src/main/jniLibs')

tasks.register('copyAndroidNatives', CopyAndroidNativesTask) {
    natives.from(nativesConfiguration)
    outputDir.set(jniLibsDir)
}

tasks.named('preBuild') {
    dependsOn tasks.named('copyAndroidNatives')
}
